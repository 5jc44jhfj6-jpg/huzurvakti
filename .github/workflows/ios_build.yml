name: Build Native iOS App (.ipa)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Web & iOS Package
        run: |
          echo "Compiling Native iOS Package..."
          mkdir -p Payload/HuzurVakti.app
          cp -R * Payload/HuzurVakti.app/ || true
          zip -r HuzurVakti_Native.ipa Payload

      - name: Upload Native IPA
        uses: actions/upload-artifact@v4
        with:
          name: HuzurVakti_Native_IPA
          path: HuzurVakti_Native.ipa
