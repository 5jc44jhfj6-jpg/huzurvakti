workflows:
  ios-app-store:
    name: Huzur Vakti iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Build iOS Application
        script: |
          echo "Building Huzur Vakti iOS Application..."
          mkdir -p build
          zip -r build/HuzurVakti.zip . -x "*.git*"
    artifacts:
      - build/*.zip
      - "*.zip"
      - "*.ipa"
    publishing:
      email:
        recipients:
          - fahrettinyaldiz@outlook.com
          - yaldizzfahrettin@gmail.com
