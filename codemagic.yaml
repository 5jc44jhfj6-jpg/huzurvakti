workflows:
  ios-app-store:
    name: Huzur Vakti iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Prepare Huzur Vakti Web App
        script: |
          echo "Preparing Huzur Vakti iOS Package..."
          mkdir -p output
          zip -r output/huzurvakti.zip . -x "*.git*"
    artifacts:
      - output/*.zip
      - "*.zip"
      - "*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - fahrettinyaldiz@outlook.com
