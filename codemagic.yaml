workflows:
  ios-app-store:
    name: Huzur Vakti iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Huzur Vakti
    scripts:
      - name: Prepare Huzur Vakti Application
        script: |
          echo "Preparing Huzur Vakti App..."
          mkdir -p output
          zip -r output/HuzurVakti.zip . -x "*.git*"
    artifacts:
      - output/*.zip
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - fahrettinyaldiz@outlook.com
