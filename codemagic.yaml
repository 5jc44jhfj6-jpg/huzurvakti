workflows:
  ios-app-store:
    name: Huzur Vakti iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Huzur Vakti
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.huzurvakti.namazvakitleri
      vars:
        BUNDLE_ID: com.huzurvakti.namazvakitleri
        XCODE_WORKSPACE: "Huzur Vakti.xcworkspace"
        XCODE_SCHEME: "Huzur Vakti"
    scripts:
      - name: Install CocoaPods
        script: |
          cd "Huzur Vakti"
          pod install --repo-update
      - name: Build iOS App
        script: |
          cd "Huzur Vakti"
          xcode-project use-profiles
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/HuzurVakti.xcarchive" \
            CODE_SIGN_STYLE=Automatic \
            archive
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/HuzurVakti.xcarchive" \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath "$CM_BUILD_DIR/output"
    artifacts:
      - "**/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - fahrettinyaldiz@outlook.com
